<div class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans">
  
  <!-- Contenedor Reactivo de Toasts -->
  <app-toast-container></app-toast-container>

  <!-- Cabecera de Cristal Oscuro Premium -->
  <header class="sticky top-0 z-40 w-full glass-dark border-b border-slate-800/60 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">

      <div class="flex items-center gap-12">
        <div class="flex items-center gap-3">
          <span class="text-3xl animate-bounce">☕</span>
          <span class="font-display font-black text-2xl tracking-tighter bg-gradient-to-r from-orange-500 to-amber-400 bg-clip-text text-transparent uppercase">
            Cafecito
          </span>
        </div>

        <nav class="hidden md:flex gap-3">
          <a routerLink="/pos" routerLinkActive="bg-orange-600/20 text-orange-400 border-orange-500/30"
            class="px-4 py-2.5 rounded-xl text-sm font-semibold tracking-wide border border-transparent hover:bg-slate-800 hover:text-slate-200 transition-all duration-200">
            Ventas
          </a>

          <a *ngIf="authService.userRole() === 'admin'" routerLink="/admin/inventory"
            routerLinkActive="bg-orange-600/20 text-orange-400 border-orange-500/30"
            class="px-4 py-2.5 rounded-xl text-sm font-semibold tracking-wide border border-transparent hover:bg-slate-800 hover:text-slate-200 transition-all duration-200">
            Inventario
          </a>

          <a *ngIf="authService.userRole() === 'admin'" routerLink="/register"
            routerLinkActive="bg-orange-600/20 text-orange-400 border-orange-500/30"
            class="px-4 py-2.5 rounded-xl text-sm font-semibold tracking-wide border border-transparent hover:bg-slate-800 hover:text-slate-200 transition-all duration-200">
            Usuarios
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-6">
        <div class="hidden lg:block text-right pr-6 border-r border-slate-800/80">
          <p class="text-[9px] text-slate-500 uppercase font-black tracking-widest mb-0.5">Rol de Acceso</p>
          <p class="text-xs font-bold text-orange-400 capitalize">{{ authService.userRole() }}</p>
        </div>

        <div class="hidden sm:block text-right pr-6 border-r border-slate-800/80">
          <p class="text-[9px] text-slate-500 uppercase font-black tracking-widest mb-0.5">Terminal</p>
          <p class="text-xs font-bold text-emerald-400 flex items-center gap-1.5 justify-end">
            <span class="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span> En línea
          </p>
        </div>

        <button (click)="logout()"
          class="bg-rose-950/80 hover:bg-rose-900 border border-rose-800/30 hover:border-rose-700 text-rose-300 px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-transform active:scale-95 shadow-lg shadow-rose-950/20 cursor-pointer">
          Cerrar Sesión
        </button>
      </div>

    </div>
  </header>

  <!-- Contenedor Principal Animado -->
  <main [ngClass]="isPosRoute() ? 'w-full max-w-7xl mx-auto h-[calc(100vh-80px)] overflow-hidden flex flex-col p-4 md:p-5 animate-fade-in' : 'flex-1 max-w-7xl mx-auto w-full p-6 md:p-8 animate-fade-in'">
    <router-outlet></router-outlet>
  </main>

  <footer *ngIf="!isPosRoute()" class="bg-slate-950 border-t border-slate-900 py-6 text-center">
    <p class="text-xs text-slate-600 font-medium">Cafecito Feliz POS © 2026 • Diseñado con Excelencia</p>
  </footer>

</div>
