<div class="w-full glass-dark rounded-3xl p-8 border border-white/10 shadow-2xl backdrop-blur-xl animate-fade-in">
  
  <div class="text-center mb-8">
    <span class="text-4xl block mb-2 animate-bounce">☕</span>
    <h1 class="text-3xl font-display font-black tracking-tight bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent uppercase">
      Cafecito Feliz
    </h1>
    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Terminal de Ventas</p>
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
    <div>
      <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Correo Electrónico</label>
      <input type="email" name="email" [(ngModel)]="credentials.email" required
        class="w-full px-4 py-3.5 bg-slate-950/60 border border-slate-800 text-white rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-xs transition duration-200">
    </div>

    <div>
      <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Contraseña</label>
      <input type="password" name="password" [(ngModel)]="credentials.password" required
        class="w-full px-4 py-3.5 bg-slate-950/60 border border-slate-800 text-white rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-xs transition duration-200">
    </div>

    <div *ngIf="error" class="p-3.5 bg-rose-950/40 border border-rose-500/20 rounded-xl text-rose-300 text-xs font-bold flex items-center gap-2.5 animate-fade-in">
      <span>⚠️</span> {{ error }}
    </div>

    <button type="submit" [disabled]="!loginForm.valid"
      class="w-full bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-700 hover:to-amber-600 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-500 text-white font-display font-black text-xs uppercase tracking-widest py-4 rounded-xl shadow-lg shadow-orange-950/20 transition-all cursor-pointer disabled:cursor-not-allowed active:scale-97">
      Iniciar Sesión
    </button>
  </form>
</div>
