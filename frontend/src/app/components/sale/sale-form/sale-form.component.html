<div class="mt-4 p-4 rounded-2xl bg-slate-900/40 border border-slate-800/80">
  <h3 class="text-sm font-display font-black text-slate-300 mb-4 uppercase tracking-wider">Finalizar Transacción</h3>

  <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Método de Pago</label>
  <div class="grid grid-cols-3 gap-3 mb-5">
    <button type="button" (click)="setMethod('cash')" 
            [ngClass]="{
              'ring-2 bg-orange-600/10 text-orange-400 border-orange-500/30': method === 'cash',
              'text-slate-400 border-slate-800 bg-slate-950/40': method !== 'cash'
            }"
            class="flex flex-col items-center justify-center p-3 rounded-xl border hover:text-slate-200 hover:border-slate-700 transition cursor-pointer ring-orange-500">
      <span class="text-[10px] font-extrabold uppercase tracking-wider">Efectivo</span>
    </button>
    
    <button type="button" (click)="setMethod('card')" 
            [ngClass]="{
              'ring-2 bg-orange-600/10 text-orange-400 border-orange-500/30': method === 'card',
              'text-slate-400 border-slate-800 bg-slate-950/40': method !== 'card'
            }"
            class="flex flex-col items-center justify-center p-3 rounded-xl border hover:text-slate-200 hover:border-slate-700 transition cursor-pointer ring-orange-500">
      <span class="text-[10px] font-extrabold uppercase tracking-wider">Tarjeta</span>
    </button>

    <button type="button" (click)="setMethod('transfer')" 
            [ngClass]="{
              'ring-2 bg-orange-600/10 text-orange-400 border-orange-500/30': method === 'transfer',
              'text-slate-400 border-slate-800 bg-slate-950/40': method !== 'transfer'
            }"
            class="flex flex-col items-center justify-center p-3 rounded-xl border hover:text-slate-200 hover:border-slate-700 transition cursor-pointer ring-orange-500">
      <span class="text-[10px] font-extrabold uppercase tracking-wider">Transf.</span>
    </button>
  </div>

  <div class="mb-5">
    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Identificar Socio (Teléfono/Email)</label>
    <div class="flex gap-2">
      <input type="text" [(ngModel)]="customerInput" placeholder="Ej. socio@cafecito.com" class="flex-1 px-4 py-3 bg-slate-950/60 border border-slate-800 text-white rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-xs" />
      <button type="button" (click)="searchCustomer()" class="bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 px-4 rounded-xl transition cursor-pointer">
        <span class="text-[10px] font-black uppercase tracking-wider">Validar</span>
      </button>
    </div>

    @if (selectedCustomer()) {
      <div class="mt-3 p-3 bg-emerald-950/40 border border-emerald-500/20 rounded-xl flex justify-between items-center animate-fade-in">
        <div>
          <p class="text-[8px] text-emerald-400 font-black uppercase tracking-widest">Socio Activo</p>
          <p class="text-xs font-bold text-white leading-snug">{{ selectedCustomer().name }}</p>
        </div>
        <span class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full text-[9px] font-black uppercase">
          Compras: {{ selectedCustomer().purchases_count }}
        </span>
      </div>
    }

    @if (isNewCustomer()) {
      <div class="mt-3 p-4 bg-orange-950/20 border border-dashed border-orange-500/20 rounded-xl animate-fade-in">
        <p class="text-[9px] font-black text-orange-400 mb-2.5 uppercase tracking-wider">✨ NUEVO SOCIO: REGISTRAR NOMBRE</p>
        <input type="text" [(ngModel)]="customerName" placeholder="Nombre completo" class="w-full px-3 py-2.5 bg-slate-950/60 border border-slate-800 text-white rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-xs" />
      </div>
    }

    @if (errorMessage()) {
      <p class="mt-1.5 text-[10px] text-rose-500 font-bold">{{ errorMessage() }}</p>
    }
  </div>

  <button (click)="confirmSale()" class="w-full py-4 bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-700 hover:to-amber-600 text-white font-display font-black text-xs uppercase tracking-widest rounded-xl transition shadow-lg shadow-orange-950/30 active:scale-97 cursor-pointer mt-4">
    Confirmar y Cobrar Venta
  </button>
</div>
