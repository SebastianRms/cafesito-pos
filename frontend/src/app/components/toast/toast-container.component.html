<div class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto flex items-center justify-between p-4 rounded-2xl shadow-2xl backdrop-blur-md border animate-fade-in transition-all duration-300"
      [ngClass]="{
        'bg-emerald-950/90 text-emerald-100 border-emerald-500/30': toast.type === 'success',
        'bg-rose-950/90 text-rose-100 border-rose-500/30': toast.type === 'error',
        'bg-amber-950/90 text-amber-100 border-amber-500/30': toast.type === 'warning',
        'bg-slate-900/90 text-slate-100 border-slate-700/30': toast.type === 'info'
      }">
      
      <div class="flex items-center gap-3">
        @if (toast.type === 'success') {
          <span class="text-xl">✨</span>
        } @else if (toast.type === 'error') {
          <span class="text-xl">⚠️</span>
        } @else if (toast.type === 'warning') {
          <span class="text-xl">🔥</span>
        } @else {
          <span class="text-xl">☕</span>
        }
        <span class="text-xs font-bold tracking-wide">{{ toast.message }}</span>
      </div>

      <button 
        (click)="toastService.remove(toast.id)"
        class="ml-4 text-xs font-black opacity-60 hover:opacity-100 cursor-pointer p-1">
        ✕
      </button>
    </div>
  }
</div>
