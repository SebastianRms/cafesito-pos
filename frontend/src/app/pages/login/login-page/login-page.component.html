<div class="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-amber-950 via-slate-950 to-black p-4 relative overflow-hidden">
  
  <!-- Círculos de Luces Ambientales (Efecto WOW) -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-orange-600/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>

  <app-login-form 
    [error]="errorMessage" 
    (loginSubmit)="handleLogin($event)"
    class="w-full max-w-md animate-fade-in relative z-10">
  </app-login-form>
</div>
